services:
  - type: web
    name: setu-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMMA_MODE
        value: hosted
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_API_BASE
        sync: false

  - type: web
    name: setu-frontend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: BACKEND_URL
        value: "https://setu-backend.onrender.com"
